<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0c1426" />
  <title>ASAP Advisor Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-mark"><img src="/assets/asap-logo.png" alt="" /></div>
      <div class="splash-word">ASAP</div>
      <div class="splash-sub">ADVISOR CONSOLE</div>
    </div>
  </div>

  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand" role="banner">
        <img src="/assets/asap-logo.png" class="brand-logo" alt="ASAP logo" />
        <div><div class="brand-name">ASAP</div><div class="brand-sub">ADVISOR CONSOLE</div></div>
      </div>
      <div class="nav-kicker">WORKSPACE</div>
      <nav class="nav" aria-label="Primary">
        <a href="/" data-route="/" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span>Command Center</span><span class="nav-arrow">→</span>
        </a>
        <a href="/policy" data-route="/policy" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22V5.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22V5.5Z"/></svg></span>
          <span>Policy Library</span><span class="nav-arrow">→</span>
        </a>
        <a href="/oversight" data-route="/oversight" class="nav-item">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5.2-3.4 8.5-8 10-4.6-1.5-8-4.8-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>
          <span>Model &amp; Oversight</span><span class="nav-arrow">→</span>
        </a>
      </nav>
      <div class="sidebar-spacer"></div>
      <a class="oversight-note" href="/oversight" data-route="/oversight">
        <div class="oversight-note-title">Human review first</div>
        <p>Every signal is a starting point for review, never a verdict.</p>
        <span>Read oversight notes →</span>
      </a>
      <div class="advisor-card"><div class="avatar">SA</div><div><strong>Sara</strong><span>Academic Advisor</span></div></div>
    </aside>

    <section class="content-shell">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open navigation"><span aria-hidden="true">☰</span></button>
        <div class="topbar-context-wrap">
          <div class="top-context" id="topContext">ASAP / COMMAND CENTER</div>
          <div class="top-date" id="topDate"></div>
        </div>
        <div class="top-actions">
          <button id="bellBtn" class="icon-btn bell-btn" aria-label="Notifications" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
            <span id="bellDot" class="bell-dot"></span>
          </button>
          <div class="mini-avatar" aria-label="Advisor Sara">SA</div>
        </div>
        <div id="notificationPopover" class="popover hidden" role="dialog" aria-label="Notifications"></div>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </section>
  </div>
  <div id="studentModal" class="modal-backdrop hidden" aria-hidden="true"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
